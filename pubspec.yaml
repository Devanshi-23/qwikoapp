
name: qwiko_delivery_agent
description: "Qwiko delivery partner (rider) app. Runs offline on local demo data."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to privately publish the package.

# The following defines the version and build number for your application.
# A version number is three numbers separated by a dot, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts of the product and
# file versions, while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions,
# consider running `flutter pub upgrade --major-versions`. However, this may upgrade
# your application to use newer versions of packages.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  url_launcher: ^6.3.3
  http: ^1.6.0
  image_picker: ^1.2.4
  google_maps_flutter: ^2.18.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The following adds the Flutter Lints package to your application.
  # The lint set below contains recommended lints to encourage good coding practices.
  # The lint set is activated in the analysis_options.yaml file located at the root
  # of your package. See that file for information about deactivating specific lint rules.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

# App launcher icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that the font is included in the build.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # Qwiko app logo and images
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific variants, see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list must contain a "family" key
  # with the font family name and a "fonts" key with a list of fonts.
  # Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
